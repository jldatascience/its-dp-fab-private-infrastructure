    dagReference: null   # [A_RENSEIGNER] Quoi : référence du flux dans le DAG | Pourquoi : contrôle de cohérence DAG / manifeste annoncé par Mick | Qui : architecte | Où : DAG du data product | Bloquant : non
    approvalOwner: "Data Platform (administrateur du workspace)"
    validationStatus:
      DEV: "à vérifier"
      ITG: "non applicable (non synchronisé)"
      PPR: "non applicable (non synchronisé)"
      PRD: "non applicable (non synchronisé)"
    evidence: "liste des workspaces par environnement, 12/11/2026"
  - id: ucs-referentiel-p2-framework
    pattern: P2
    direction: sortant
    source: ucs-referentiel
    target: "framework-items"
    mechanism: "Data Connection Rule « Fabric Data Pipelines » (Invoke Pipeline data product → Framework, connexion DP-Fabric-Global-APR)"
    ruleCarriedBy: ucs-referentiel   # le flux est déclaré dans le manifeste du workspace qui porte la règle (PROPOSÉ)
    protocol: null   # [A_VERIFIER] Quoi : protocole du flux | Pourquoi : documentation du flux et contrôle DAG | Qui : architecte / équipe produit | Où : DAG du data product | Bloquant : non
    port: null   # [A_VERIFIER] Quoi : port réseau | Pourquoi : seuls les flux N1 à N3 (réseau hub) passent par le firewall ; les flux internes Fabric n’ouvrent pas de règle Palo Alto (à confirmer) | Qui : architecte / réseau France | Où : DAG, matrice des flux réseau | Bloquant : non
    businessJustification: "Orchestration par les pipelines « sur étagère » du Framework"
    dagReference: null   # [A_RENSEIGNER] Quoi : référence du flux dans le DAG | Pourquoi : contrôle de cohérence DAG / manifeste annoncé par Mick | Qui : architecte | Où : DAG du data product | Bloquant : non
    approvalOwner: "Data Platform (administrateur du workspace)"
    validationStatus:
      DEV: "à vérifier"
      ITG: "à faire"
      PPR: "à faire"
      PRD: "à faire"
    evidence: "Cartographie simplifiée des flux Microsoft Fabric (Matrice DEV : UCS Referentiel → Framework = P2)"
    # [A_VERIFIER] Quoi : appel de pipelines du Framework par un UCS | Pourquoi : la matrice v1.3 du socle CI/CD (R5) interdit toute dépendance de déploiement à un UCS ; une référence Invoke Pipeline au Framework resterait pointée sur DEV | Qui : architecte / équipe produit | Où : socle its-dp-fab-cicd-common, dependencies.yml du dépôt | Bloquant : non

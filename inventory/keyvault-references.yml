    subscription: FR-AZR-DP-DEV
    rbac: true
    publicNetworkAccess: null   # [A_VERIFIER] Quoi : valeur publicNetworkAccess | Pourquoi : absente de l’export (networkAcls.defaultAction = Deny) | Qui : équipe produit | Où : az keyvault show --query properties.publicNetworkAccess | Bloquant : non

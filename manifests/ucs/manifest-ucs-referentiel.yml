privatisation:
  networkProfile: private   # standard : accès public refusé, Private Link + Private Endpoint, OAP active
  inbound:
    publicAccess: deny
    workspacePrivateLink: true
    privateEndpoint: true   # un Private Endpoint dédié dans le subnet MUTUALISÉ de l’environnement (aucun VNet ni subnet par workspace)
  outbound:
    accessProtection: true
  dns:
    zone: privatelink.fabric.microsoft.com   # CONFIRMÉ (fiche « ID de la zone DNS privée à utiliser » (zone privatelink.fabric.microsoft.com du hub))
    zoneId: /subscriptions/1fe4e122-3c20-4707-88ed-3ce3fa2e259f/resourceGroups/frinfalzconnectivityprivatedns0001/providers/Microsoft.Network/privateDnsZones/privatelink.fabric.microsoft.com   # CONFIRMÉ : souscription fr-connectivity, zone globale gérée par Terraform (tag Status: Managed by Terraform)
    zoneIdOtherEnvironments: null   # [A_CONFIRMER_GLOBAL] Quoi : même zone pour ITG, PPR et PRD ? | Pourquoi : la zone n’a qu’un seul lien de réseau virtuel ; les enregistrements des Private Endpoints ITG/PPR/PRD doivent y être résolus | Qui : Global / équipe connectivité | Où : fiche de la zone DNS, liens VNet | Bloquant : non
    recordRegistration: null   # [HORS_PERIMETRE_PRODUIT] Quoi : qui écrit les enregistrements A des Private Endpoints dans la zone (DNS zone group du module ou Terraform connectivité) | Pourquoi : zone gérée par Terraform : une écriture hors de ce code crée de la dérive ; le VNet DEV résout via le DNS du hub 10.113.192.100 | Qui : Global / équipe réseau | Où : abonnement du hub | Bloquant : non

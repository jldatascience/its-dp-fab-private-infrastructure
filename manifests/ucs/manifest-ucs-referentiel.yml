    DEV: {resourceGroup: frappdevdp0001, vnet: fralzvnetdev1055, subnet: snet-kpmg-backend, routeTable: fr_rt_fralzvnetdev1055}   # CONFIRMÉ (export VNet, inventaire des ressources)
